<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 685" role="img"><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#eaf1fb}.title{font-size:31px;font-weight:750}.sub{font-size:17px;fill:#adbed3}.h{font-size:21px;font-weight:700}.main{font-size:19px;font-weight:650}.small{font-size:15px;fill:#bacce3}.addr{font-family:monospace;font-size:16px;fill:#eefaff}.arrow{stroke:#90a7c4;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#90a7c4"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#0e1b2d"/><text x="610" y="50" class="title" text-anchor="middle">Space Zap • Z80 address space</text><text x="610" y="80" class="sub" text-anchor="middle">64 KB logical overview — ROM and TERSE addresses confirmed; non-ROM decode provisional</text><rect x="80" y="109" width="1040" height="43" rx="6" fill="#273449"/><text x="258" y="137" class="addr" text-anchor="middle">$E000–$FFFF</text><text x="430" y="137" class="main" text-anchor="start">Unmapped / unclassified</text><rect x="80" y="157" width="1040" height="43" rx="6" fill="#365a58"/><text x="258" y="185" class="addr" text-anchor="middle">$D800–$DFFF</text><text x="430" y="185" class="main" text-anchor="start">RAM: IX control stack from $D800</text><rect x="80" y="205" width="1040" height="43" rx="6" fill="#365a58"/><text x="258" y="233" class="addr" text-anchor="middle">$D780–$D7FF</text><text x="430" y="233" class="main" text-anchor="start">RAM: SP stack begins $D780</text><rect x="80" y="253" width="1040" height="43" rx="6" fill="#365a58"/><text x="258" y="281" class="addr" text-anchor="middle">$D000–$D77F</text><text x="430" y="281" class="main" text-anchor="start">Work RAM / game state</text><rect x="80" y="301" width="1040" height="43" rx="6" fill="#273449"/><text x="258" y="329" class="addr" text-anchor="middle">$C000–$CFFF</text><text x="430" y="329" class="main" text-anchor="start">Unclassified — verify hardware decode</text><rect x="80" y="349" width="1040" height="43" rx="6" fill="#4a3f5b"/><text x="258" y="377" class="addr" text-anchor="middle">$8000–$BFFF</text><text x="430" y="377" class="main" text-anchor="start">Upper address window / decode TBD</text><rect x="80" y="397" width="1040" height="43" rx="6" fill="#264d62"/><text x="258" y="425" class="addr" text-anchor="middle">$4000–$7FFF</text><text x="430" y="425" class="main" text-anchor="start">Video RAM / screen access</text><rect x="80" y="445" width="1040" height="43" rx="6" fill="#435b83"/><text x="258" y="473" class="addr" text-anchor="middle">$3000–$3FFF</text><text x="430" y="473" class="main" text-anchor="start">ROM X4 • compiled stream + vectors</text><rect x="80" y="493" width="1040" height="43" rx="6" fill="#435b83"/><text x="258" y="521" class="addr" text-anchor="middle">$2000–$2FFF</text><text x="430" y="521" class="main" text-anchor="start">ROM X3 • graphics & game data</text><rect x="80" y="541" width="1040" height="43" rx="6" fill="#435b83"/><text x="258" y="569" class="addr" text-anchor="middle">$1000–$1FFF</text><text x="430" y="569" class="main" text-anchor="start">ROM X2 • program and tables</text><rect x="80" y="589" width="1040" height="43" rx="6" fill="#435b83"/><text x="258" y="617" class="addr" text-anchor="middle">$0000–$0FFF</text><text x="430" y="617" class="main" text-anchor="start">ROM X1 • TERSE kernel & native words</text><text x="610" y="654" class="small" text-anchor="middle">Addresses reflect CPU-visible mappings; review with MAME driver and PCB schematics before hardware claims.</text></svg>