<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img"><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#eaf1fb}.title{font-size:31px;font-weight:750}.sub{font-size:17px;fill:#adbed3}.h{font-size:21px;font-weight:700}.main{font-size:19px;font-weight:650}.small{font-size:15px;fill:#bacce3}.addr{font-family:monospace;font-size:16px;fill:#eefaff}.arrow{stroke:#90a7c4;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#90a7c4"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#0e1b2d"/><text x="600" y="51" class="title" text-anchor="middle">Two TERSE threading formats</text><text x="600" y="80" class="sub" text-anchor="middle">Same BC / IX / SP / IY execution family; different token representation</text><text x="295" y="137" class="h" text-anchor="middle">SPACE ZAP • INDEXED TOKEN</text><text x="905" y="137" class="h" text-anchor="middle">CARTRIDGE • DIRECT THREAD</text><rect x="95" y="158" width="400" height="92" rx="11" fill="#144b53" stroke="#5d7594" stroke-width="1.3"/><text x="295" y="195" class="main" text-anchor="middle">BC reads one byte</text><text x="295" y="224" class="addr" text-anchor="middle">token $35</text><rect x="705" y="158" width="400" height="92" rx="11" fill="#2c435c" stroke="#5d7594" stroke-width="1.3"/><text x="905" y="195" class="main" text-anchor="middle">BC reads two bytes</text><text x="905" y="224" class="addr" text-anchor="middle">address $2180</text><path d="M295 257 L295 302" class="arrow" marker-end="url(#arrow)"/><path d="M905 257 L905 302" class="arrow" marker-end="url(#arrow)"/><rect x="95" y="309" width="400" height="105" rx="11" fill="#223f59" stroke="#5d7594" stroke-width="1.3"/><text x="295" y="346" class="main" text-anchor="middle">ROM token vector table</text><text x="295" y="377" class="addr" text-anchor="middle">$3DEA + (2 × $35)</text><rect x="705" y="309" width="400" height="105" rx="11" fill="#223f59" stroke="#5d7594" stroke-width="1.3"/><text x="905" y="345" class="main" text-anchor="middle">No vector table</text><text x="905" y="375" class="small" text-anchor="middle">native address already resolved</text><path d="M295 419 L295 468" class="arrow" marker-end="url(#arrow)"/><path d="M905 419 L905 468" class="arrow" marker-end="url(#arrow)"/><rect x="95" y="475" width="400" height="76" rx="11" fill="#35517a" stroke="#5d7594" stroke-width="1.3"/><text x="295" y="507" class="main" text-anchor="middle">Native Z80 word</text><text x="295" y="534" class="addr" text-anchor="middle">JP (HL)</text><rect x="705" y="475" width="400" height="76" rx="11" fill="#35517a" stroke="#5d7594" stroke-width="1.3"/><text x="905" y="507" class="main" text-anchor="middle">Native Z80 word</text><text x="905" y="534" class="addr" text-anchor="middle">JP (HL)</text><text x="295" y="607" class="small" text-anchor="middle">1 byte per word + 512-byte lookup table</text><text x="905" y="607" class="small" text-anchor="middle">2 bytes per word + direct dispatch</text></svg>