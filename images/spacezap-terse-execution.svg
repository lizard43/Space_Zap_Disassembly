<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img"><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#eaf1fb}.title{font-size:31px;font-weight:750}.sub{font-size:17px;fill:#adbed3}.h{font-size:21px;font-weight:700}.main{font-size:19px;font-weight:650}.small{font-size:15px;fill:#bacce3}.addr{font-family:monospace;font-size:16px;fill:#eefaff}.arrow{stroke:#90a7c4;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#90a7c4"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#0e1b2d"/><text x="600" y="49" class="title" text-anchor="middle">Space Zap • indexed TERSE execution</text><text x="600" y="78" class="sub" text-anchor="middle">ROM entry $0008, interpreter $0035, 256-slot vectors at $3DEA</text><rect x="83" y="136" width="263" height="83" rx="11" fill="#20516a" stroke="#5d7594" stroke-width="1.3"/><text x="214" y="169" class="main" text-anchor="middle">BC • token stream</text><text x="214" y="195" class="addr" text-anchor="middle">initial $3CDC</text><path d="M347 178 L419 178" class="arrow" marker-end="url(#arrow)"/><rect x="430" y="136" width="324" height="83" rx="11" fill="#23435c" stroke="#5d7594" stroke-width="1.3"/><text x="592" y="169" class="main" text-anchor="middle">NEXT @ $0035</text><text x="592" y="195" class="small" text-anchor="middle">read 8-bit token, advance BC</text><path d="M592 227 L592 278" class="arrow" marker-end="url(#arrow)"/><rect x="414" y="287" width="356" height="91" rx="11" fill="#2f5066" stroke="#5d7594" stroke-width="1.3"/><text x="592" y="326" class="main" text-anchor="middle">Vector table @ $3DEA</text><text x="592" y="353" class="small" text-anchor="middle">entry = table + 2 × token</text><path d="M592 385 L592 434" class="arrow" marker-end="url(#arrow)"/><rect x="414" y="441" width="356" height="91" rx="11" fill="#27646a" stroke="#5d7594" stroke-width="1.3"/><text x="592" y="479" class="main" text-anchor="middle">Native primitive</text><text x="592" y="506" class="addr" text-anchor="middle">JP (IY) → $0035</text><path d="M775 479 L1032 479 L1032 176 L762 176" class="arrow" marker-end="url(#arrow)"/><rect x="72" y="320" width="248" height="124" rx="11" fill="#513f60" stroke="#5d7594" stroke-width="1.3"/><text x="196" y="351" class="main" text-anchor="middle">RST $08 • colon entry</text><text x="196" y="378" class="small" text-anchor="middle">save BC using IX</text><text x="196" y="402" class="small" text-anchor="middle">POP BC → nested thread</text><rect x="868" y="568" width="265" height="67" rx="11" fill="#594b39" stroke="#5d7594" stroke-width="1.3"/><text x="1000" y="594" class="main" text-anchor="middle">EXIT @ $0044</text><text x="1000" y="616" class="small" text-anchor="middle">restore BC from IX</text><text x="600" y="595" class="sub" text-anchor="middle">SP: data stack    •    IX: control stack    •    IY: NEXT continuation</text></svg>